# Regole di normalizzazione delle varianti.
#
# Per ogni parola:
#   lessemi:   famiglia di parole (livello della mappa di default)
#     <Lessema>:
#       <Pronuncia>: [regex, ...]   livello fine, attivabile con "mostra pronunce"
#   escluse:   risposte scartate, confrontate per testo esatto (maiuscole e spazi ignorati)
#
# Le regex si applicano alla CHIAVE della risposta (build/normalizza.py, funzione chiave):
# minuscole, senza articolo iniziale (ol, la, il, el, lo, al, l'), senza testo tra parentesi,
# senza accenti tranne ö e ü, senza spazi e punteggiatura, con le doppie ridotte a una lettera.
# Esempi: "Ol butù de la pansa" -> butudelapansa, "Scossàl" -> scosal, "Pötvecc" -> pötvec.
# Vince la prima regex che corrisponde, nell'ordine del file.
# Le risposte che citano più forme ("Poia o Galina") vengono divise in parti uguali.
# Le risposte lunghe (più di 5 parole) vanno nei commenti e restano fuori dalla stima.
# Tutto ciò che non corrisponde a nessuna regola finisce in "Altre forme".

Fradicio:
  lessemi:
    Maserét:
      Maserét: ["^s?mas[ae]r[eé]t", "^masnet", "^masero$"]
      Masér: ["^mas[eè]r$"]
      Maseràt: ["^mas[ae]rat"]
    Bagnàt:
      Bagnàt: ["^(stra)?bagn"]
    Trebatìt:
      Trebatìt: ["^s?t?r[aeiouü]+batit?", "^trebati", "^trabati[cd]", "^trebatid"]
    Imbrombét:
      Imbrombét: ["^i?m?b?r[ou]mb[eéa]t", "^ntrombat", "^m?piömbet", "^mpiombet"]
    Ciómbo:
      Ciómbo: ["^c[iö]*[oi]mb", "^nciombet"]
    Méss:
      Méss: ["^m[eéèiì]s", "^me[sz]", "^miz", "^metz", "^mec$", "^mesc"]
    Laàt:
      Laàt: ["^la+h?a?t", "^lavat"]
    Slòzz:
      Slòzz: ["^sl[oö]z"]
    Fràdec:
      Fràdec: ["^fr[aà]de"]
  escluse: ["Fradicio trebatit", "Bagnato mezzo", "Mezzo", "Lavat", "Pingue", "pezzata", "Stra mezz 😂", "Bagnat trunk", "Non lo dico", "Alagat(allagato) o bagnat"]

